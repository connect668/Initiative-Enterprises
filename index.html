<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Initiative Enterprises</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Segoe UI", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          sans-serif;
        background: #05070c;
        color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at top, rgba(92, 124, 169, 0.16), transparent 28%),
          linear-gradient(180deg, #05070c 0%, #06080d 52%, #04060a 100%);
        color: #f4f7fb;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), transparent 90%);
        opacity: 0.72;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      #root {
        min-height: 100vh;
      }

      .html-fallback {
        position: relative;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% 18%, rgba(133, 164, 210, 0.14), transparent 24%),
          linear-gradient(180deg, #06080d 0%, #04060a 100%);
      }

      .html-fallback::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(115deg, transparent 0%, rgba(157, 194, 255, 0.08) 48%, transparent 56%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 30%);
      }

      .html-intro {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        text-align: center;
        z-index: 3;
      }

      .html-intro-copy {
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: clamp(2rem, 5vw, 4.6rem);
        font-weight: 700;
        color: #f5f8ff;
        text-shadow: 0 0 28px rgba(113, 150, 218, 0.18);
      }

      .html-split {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        min-height: 100vh;
      }

      .html-panel {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 100vh;
        padding: 48px;
        overflow: hidden;
      }

      .html-panel::before {
        content: "";
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }

      .html-panel.guardian {
        background:
          linear-gradient(135deg, rgba(9, 17, 28, 0.96), rgba(8, 12, 19, 0.95)),
          linear-gradient(180deg, transparent, rgba(28, 53, 79, 0.22));
      }

      .html-panel.checkpoint {
        background:
          linear-gradient(135deg, rgba(11, 12, 20, 0.96), rgba(9, 10, 15, 0.95)),
          linear-gradient(180deg, transparent, rgba(55, 47, 84, 0.18));
      }

      .html-divider {
        position: absolute;
        top: 7%;
        bottom: 7%;
        left: 50%;
        width: 1px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.34), transparent);
        box-shadow: 0 0 24px rgba(121, 160, 235, 0.14);
        z-index: 2;
      }

      .html-panel-content {
        position: relative;
        max-width: 460px;
      }

      .html-label {
        margin: 0 0 18px;
        font-size: 0.78rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(209, 220, 242, 0.62);
      }

      .html-title {
        margin: 0;
        font-size: clamp(2.25rem, 5vw, 4.8rem);
        font-weight: 700;
        letter-spacing: -0.05em;
      }

      .html-description {
        margin: 18px 0 0;
        max-width: 420px;
        font-size: 1rem;
        line-height: 1.8;
        color: rgba(225, 232, 244, 0.74);
      }

      .html-cta {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 28px;
        padding: 13px 18px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        font-size: 0.88rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .html-cta::after {
        content: "\203A";
        font-size: 1.1rem;
      }

      @media (max-width: 980px) {
        .html-split {
          grid-template-columns: 1fr;
        }

        .html-panel {
          min-height: 50vh;
          padding: 32px 24px;
        }

        .html-divider {
          left: 8%;
          right: 8%;
          top: 50%;
          bottom: auto;
          width: auto;
          height: 1px;
          transform: translateY(-50%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="html-fallback">
        <div class="html-intro">
          <div class="html-intro-copy">Initiative Enterprises</div>
        </div>

        <section class="html-split">
          <a class="html-panel guardian" href="#/guardian">
            <div class="html-panel-content">
              <p class="html-label">Brand 01</p>
              <h2 class="html-title">Guardian</h2>
              <p class="html-description">
                Operational structure and growth support for startups and scaling businesses.
              </p>
              <span class="html-cta">Enter Guardian</span>
            </div>
          </a>

          <div class="html-divider" aria-hidden="true"></div>

          <a class="html-panel checkpoint" href="#/checkpoint-media">
            <div class="html-panel-content">
              <p class="html-label">Brand 02</p>
              <h2 class="html-title">Checkpoint Media</h2>
              <p class="html-description">
                Media, interviews, and brand storytelling that turn attention into authority.
              </p>
              <span class="html-cta">Enter Checkpoint Media</span>
            </div>
          </a>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
